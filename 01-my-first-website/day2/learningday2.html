<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="learningday2.css">


</head>


<body>

<h1> This is a test. </h1>
<h1 class = "special-h1"> Im also an h1, but different!</h1>


<button> Hi! Im a normal button. </button>
<hr>
<br>

<!-- when naming classes. always use kebab casing. No spaces are allowed.
if you use a space, it will be interpreted as another class. which will be learned more later.
Never start your classname with a digit or use special symbols like @, !, $, %, or .
even though html technically accepts it, CSS has stricter rules!!  -->

<button class="special-button">Click Me</button> <br><br><hr>
<button> Im also a normal button.</button>


<!-- expirementing with the box model even more (the idea of padding -> border -> margin). -->


<br><br>
<button class ="another-special-button"> Im a special button too! </button>

<hr><br>
<p> A slightly lamer paragraph :sad: </p>
<p class="cool-paragraph"> A slightly cooler paragraph! </p>

<div class="button-container">
    <button>One</button>    
    <button>Two</button>
    <button>Three</button>
</div>





<div class="paragraph-elements1">
    
    <p> This is a paragraph. </p>
    <p> This is another paragraph. </p>
    <p> This is yet another paragraph. </p>

</div>


<div class="paragraph-elements2">

    <p> [1] </p>
    <p> [2] </p>
    <p> [3] </p>



</div>



</body>







</html>
