<!DOCTYPE html>

<html>
    <head> <!-- head establishes the documents metadata (data thats like not visible) -->
        <title>My First Website</title>
        <link rel="stylesheet" href="day1.css">
    </head>

    <body> <!-- body basically just establishes the block of code visible to the user -->

        <!-- Note: anything enclosed w this: <> is called an element -->
        <!-- headings are h1, h2, h3, h4, h5, h6 gradually getting smaller. capping at 6 -->
        <h1>My First Website!</h1>
        <h2>Welcome to my website!</h2>


        <hr> 

        <br><br>

        <h6>My name is Goof.</h6>

        <h7>welcome to the website goof</h7> <!-- as u can see doesnt work. -->


        <!-- Paragraphs are just like normal text. -->
        <p>Hello! I am learning web development.</p>

        <!-- the <a> element creates a link. But you need to actually input it yourself -->
        <!-- This is known as an attribute (the href = part) -->   
        <!-- General structure: <tag attribute="value">content</tag>-->
          
        <a href="https://www.youtube.com" target="_blank" title = "Visit Youtube">YouTube</a>
        <br><br>


        <!-- Self explanitory! makes a clickable button -->
        <button>Click Me</button><br>



        <!-- Another crucial concept: images -->
        <!-- The <img> element is used to display images. -->
        <!-- The src attribute (source) specifies the path to the image file. -->
        <!-- Notice how it doesnt have a closing </img> -->
        <br><br>

        <img src="https://img.magnific.com/premium-photo/small-bird-is-being-held-someone-s-hand_939033-140150.jpg?semt=ais_hybrid&w=740&q=80">


        <!-- There are two types of lists: ordered (ol) and unordered (ul) -->
        <!-- Each list item is represented by the <li> element -->
        <!-- meaning that you use ul or ol to initialize  the list and then li for each item!-->    

        <p> Here is an example of an unordered list: </p>

        <ul>
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
        </ul>

        
        <p> here is an example of an ordered list:</p>

        <ol>
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
        </ol>

    </body>
</html>
